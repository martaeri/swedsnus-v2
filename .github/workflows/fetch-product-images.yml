name: Fetch matched product images

on:
  workflow_dispatch:
  push:
    branches:
      - product-images-from-upload
      - main
    paths:
      - data/product-image-sources.json
      - tools/fetch-product-images.py
      - .github/workflows/fetch-product-images.yml

permissions:
  contents: write

jobs:
  fetch-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fetch verified product images
        run: python3 tools/fetch-product-images.py

      - name: Commit downloaded assets
        run: |
          if git diff --quiet -- assets/products data/product-images.json data/product-image-import-report.json && [ -z "$(git ls-files --others --exclude-standard assets/products data/product-image-import-report.json)" ]; then
            echo "No image changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/products data/product-images.json data/product-image-import-report.json
          git commit -m "Import verified product images [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
